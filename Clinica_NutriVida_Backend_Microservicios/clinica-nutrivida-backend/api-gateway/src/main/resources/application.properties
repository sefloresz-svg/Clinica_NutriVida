spring.application.name=api-gateway
server.port=8090
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.routes[0].id=auth
spring.cloud.gateway.routes[0].uri=lb://auth
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[1].id=pacientes
spring.cloud.gateway.routes[1].uri=lb://pacientes
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/pacientes/**
spring.cloud.gateway.routes[2].id=nutricionistas
spring.cloud.gateway.routes[2].uri=lb://nutricionistas
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/nutricionistas/**
spring.cloud.gateway.routes[3].id=citas
spring.cloud.gateway.routes[3].uri=lb://citas
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/citas/**
spring.cloud.gateway.routes[4].id=servicios
spring.cloud.gateway.routes[4].uri=lb://servicios
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/servicios/**
