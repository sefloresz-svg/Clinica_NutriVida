<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes - Clínica NutriVida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="stiloPag.css">
    <link rel="stylesheet" href="navbar.css">
</head>
<body>

    <header class="header-principal">
        <div class="top-bar">
            <div class="logo-container">
                <img src="img/Captura de pantalla 2026-09-06 231024.png" alt="Logo Clínica NutriVida" class="logo">
                <span class="brand-name">Clínica NutriVida</span>
            </div>
            <div id="seccion-usuario"></div>
        </div>

        <nav class="nav-bar">
            <div class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="servicios.html">Servicios</a>
                <a href="equipo.html">Nuestros Nutricionistas</a>
                <a href="agendar.html" data-rol="Paciente,Admin">Agendar Cita</a>
                <a href="VerPacientes.html" data-rol="Nutricionista,Admin">Ver Pacientes</a>
                <a href="administrador.html" data-rol="Admin">Panel Administración</a>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold">Pacientes</h1>
            <a href="agendar.html" class="btn text-white fw-bold" style="background-color: #7c3aed; border-radius: 8px;">+ Nueva cita</a>
        </div>

        <div class="card p-4 shadow-sm border-0">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 fw-bold mb-0">Listado de pacientes</h2>
                <input type="text" id="inputBuscar" class="form-control w-25" placeholder="Buscar paciente..." onkeyup="filtrarPacientes()">
            </div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr class="text-uppercase small text-muted">
                            <th>Paciente</th>
                            <th>RUT</th>
                            <th>Fecha / Hora</th>
                            <th>Servicio</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPacientes">
                        <!-- Carga dinámicamente desde LocalStorage -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="text-center py-3">
        &copy; 2026 Clínica NutriVida - Temuco, Región de La Araucanía
    </footer>

    <script src="permisos.js"></script>
    <script src="pacientes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
