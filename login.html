<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NutriVida - Iniciar Sesión</title>
</head>
<body>

    <h1>Clínica NutriVida - Iniciar Sesión</h1>

    <form id="formLogin" onsubmit="event.preventDefault(); iniciarSesion();">
        <label>Correo Electrónico:</label>
        <input type="email" id="correoInput" required><br><br>

        <label>Contraseña:</label>
        <input type="password" id="passInput" required><br><br>

        <button type="submit">Ingresar</button>
    </form>

    <p id="mensajeError" style="color: red;"></p>

    <script src="login.js"></script>
</body>
</html>
