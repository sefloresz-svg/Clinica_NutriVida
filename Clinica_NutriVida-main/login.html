<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Clínica NutriVida</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="login-header">
                <h2>Clínica <span>NutriVida</span></h2>
                <p>Ingresa a tu cuenta para gestionar tus citas</p>
            </div>

            <form id="formLogin">
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login-submit">Ingresar</button>
            </form>

            <div class="login-footer">
                <a href="index.html">← Volver al sitio principal</a>
            </div>

        </div>
    </div>

    <script src="login.js"></script>

</body>
</html>
