<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Clínica NutriVida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="stiloPag.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="agendar.css">
</head>
<body>

    <header class="header-principal">
        <div class="top-bar">
            <div class="logo-container">
                <img src="img/Captura de pantalla 2026-09-06 231024.png" alt="Logo Clínica NutriVida" class="logo">
                <span class="brand-name">Clínica NutriVida</span>
            </div>
            <div id="seccion-usuario"></div>
        </div>

        <nav class="nav-bar">
            <div class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="servicios.html">Servicios</a>
                <a href="equipo.html">Nuestros Nutricionistas</a>
                <a href="agendar.html" data-rol="Paciente,Admin">Agendar Cita</a>
                <a href="VerPacientes.html" data-rol="Nutricionista,Admin">Ver Pacientes</a>
                <a href="administrador.html" data-rol="Admin">Panel Administración</a>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        <h1 class="mb-4">Reserva de Cita Nutricional</h1>

        <div class="row">
            <div class="col-md-7">
                <div class="card p-4 shadow-sm mb-4">
                    <h2 class="h4 mb-3">Datos de la Cita</h2>
                    
                    <div id="mensajeError" class="text-danger fw-bold mb-2"></div>
                    <div id="mensajeExito" class="text-success fw-bold mb-2"></div>

                    <form id="formAgendar" onsubmit="validarYAgendar(event)">
                        <div class="mb-3">
                            <label for="nombrePaciente" class="form-label">Nombre del Paciente:</label>
                            <input type="text" id="nombrePaciente" class="form-control" required placeholder="Ej: Juan Pérez">
                        </div>

                        <div class="mb-3">
                            <label for="rutPaciente" class="form-label">RUT:</label>
                            <input type="text" id="rutPaciente" class="form-control" required placeholder="12.345.678-9">
                        </div>

                        <div class="mb-3">
                            <label for="selectServicio" class="form-label">Servicio:</label>
                            <select id="selectServicio" class="form-select" required></select>
                        </div>

                        <div class="mb-3">
                            <label for="selectNutricionista" class="form-label">Nutricionista:</label>
                            <select id="selectNutricionista" class="form-select" required></select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fechaCita" class="form-label">Fecha:</label>
                                <input type="date" id="fechaCita" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="horaCita" class="form-label">Hora:</label>
                                <input type="time" id="horaCita" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="motivoCita" class="form-label">Motivo de consulta (opcional):</label>
                            <textarea id="motivoCita" class="form-control" rows="2" placeholder="Describa brevemente..."></textarea>
                        </div>

                        <button type="submit" class="btn w-100 fw-bold text-white" style="background-color: #6b21a8; border: none; padding: 12px; border-radius: 8px;">
                            Confirmar y Agendar Cita
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card p-4 shadow-sm">
                    <h2 class="h4 mb-3">Mis Citas Registradas</h2>
                    <div id="listaCitas"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Clínica NutriVida - Temuco, Región de La Araucanía
    </footer>

    <script src="permisos.js"></script>
    <script src="agendar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
